# =============================================================================
# Deploy Staging — Automático em push para develop
# Trigger: push na branch develop
# Namespace: openshift-lab (cluster TechZone atual)
# Estratégia: git archive | oc start-build --from-archive (garante LF nos scripts S2I)
# =============================================================================
name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy → Staging (openshift-lab)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://golang-sample-openshift-lab.apps.itz-1y1puu.infra01-lb.fra02.techzone.ibm.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Build Go local (validação antes do S2I)
      # -----------------------------------------------------------------------
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: chat-backend/go.sum

      - name: Validate Go build
        working-directory: chat-backend
        run: go build -o /dev/null ./...

      # -----------------------------------------------------------------------
      # Instalar oc CLI
      # -----------------------------------------------------------------------
      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar -xz -C /usr/local/bin oc
          oc version --client

      # -----------------------------------------------------------------------
      # Login no cluster OpenShift
      # -----------------------------------------------------------------------
      - name: OCP Login
        run: |
          oc login "${{ secrets.OPENSHIFT_STAGING_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_STAGING_TOKEN }}" \
            --insecure-skip-tls-verify
          oc project openshift-lab

      # -----------------------------------------------------------------------
      # S2I Build — Backend (golang-sample)
      # git archive HEAD:chat-backend exporta a árvore sem prefixo de path
      # garantindo LF e excluindo arquivos não commitados
      # -----------------------------------------------------------------------
      - name: S2I Build — golang-sample
        run: |
          git archive HEAD:chat-backend -o backend-build.tar
          oc start-build golang-sample \
            --from-archive=backend-build.tar \
            --follow --wait \
            -n openshift-lab
          oc set image deployment/golang-sample \
            golang-sample="image-registry.openshift-image-registry.svc:5000/openshift-lab/golang-sample:latest" \
            -n openshift-lab

      # -----------------------------------------------------------------------
      # S2I Build — Frontend (nginx-sample)
      # -----------------------------------------------------------------------
      - name: S2I Build — nginx-sample
        run: |
          git archive HEAD:chat-frontend -o frontend-build.tar
          oc start-build nginx-sample \
            --from-archive=frontend-build.tar \
            --follow --wait \
            -n openshift-lab
          oc set image deployment/nginx-sample \
            nginx-sample="image-registry.openshift-image-registry.svc:5000/openshift-lab/nginx-sample:latest" \
            -n openshift-lab

      # -----------------------------------------------------------------------
      # Aguardar rollout completo
      # -----------------------------------------------------------------------
      - name: Aguardar rollout — golang-sample
        run: oc rollout status deployment/golang-sample -n openshift-lab --timeout=120s

      - name: Aguardar rollout — nginx-sample
        run: oc rollout status deployment/nginx-sample -n openshift-lab --timeout=120s

      # -----------------------------------------------------------------------
      # Health check pós-deploy
      # -----------------------------------------------------------------------
      - name: Health Check
        run: |
          BACKEND="https://golang-sample-openshift-lab.apps.itz-1y1puu.infra01-lb.fra02.techzone.ibm.com"
          bash openshift-lab/scripts/health-check.sh "$BACKEND"

      # -----------------------------------------------------------------------
      # Notificação Slack
      # -----------------------------------------------------------------------
      - name: Notify Slack — Sucesso
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":white_check_mark: *Staging Deploy OK* — `openshift-lab` @ `${{ github.sha }}` por `${{ github.actor }}`\nBranch: `${{ github.ref_name }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — Falha
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":x: *Staging Deploy FALHOU* — `openshift-lab` @ `${{ github.sha }}`\nBranch: `${{ github.ref_name }}`\nVeja: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
